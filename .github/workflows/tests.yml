name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4']
                laravel: ['10.*', '11.*', '12.*', '13.*']
                include:
                    - laravel: '10.*'
                      testbench: '8.*'
                    - laravel: '11.*'
                      testbench: '9.*'
                    - laravel: '12.*'
                      testbench: '10.*'
                    - laravel: '13.*'
                      testbench: '11.*'
                exclude:
                    - php: '8.2'
                      laravel: '13.*'

        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update --no-security-blocking
                  composer update --prefer-dist --no-interaction --with-all-dependencies --no-security-blocking

            - name: Run tests
              run: vendor/bin/pest
